<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Radovanu ITS — Status echipamente</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --text:#eef1f6; --muted:#8a92a3;
    --border:#2a2f3a; --accent:#00e5ff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #map{position:absolute;top:0;left:0;right:0;bottom:0;}

  #topbar{
    position:absolute;top:0;left:0;right:0;z-index:1000;
    background:linear-gradient(180deg,rgba(15,17,21,.92),rgba(15,17,21,0));
    padding:14px 16px 30px;pointer-events:none;
  }
  #topbar h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px;pointer-events:auto;}
  #topbar h1 span{color:var(--accent);}
  #topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;pointer-events:auto;}

  #legend{
    position:absolute;right:12px;top:12px;z-index:1000;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:14px;width:248px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    max-width:calc(100vw - 24px);
    transition:width .25s ease, padding .25s ease;
  }
  #legend h3{margin:0;font-size:13px;color:var(--text);display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;gap:8px;}
  #legend.expanded h3{margin-bottom:10px;}
  #legend h3 b{color:var(--accent);font-size:16px;}
  #legend h3 .chev{margin-left:auto;color:var(--muted);transition:transform .25s ease;flex:none;}
  #legend.collapsed h3 .chev{transform:rotate(-90deg);}
  #legend-body{overflow:hidden;max-height:820px;transition:max-height .25s ease, opacity .2s ease;opacity:1;}
  #legend.collapsed{padding:9px 14px;border-radius:22px;cursor:pointer;}
  #legend.collapsed #legend-body{max-height:0;opacity:0;}
  #legend-mini{display:none;align-items:center;gap:6px;font-weight:600;color:var(--text);white-space:nowrap;}
  #legend.collapsed #legend-mini{display:flex;}
  #legend.collapsed .mini-dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(90deg,#ff6d00,#00e676);flex:none;}
  .leg-row{display:flex;align-items:center;gap:8px;margin:6px 0;}
  .leg-dot{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:0 0 6px rgba(0,0,0,.5);}
  .leg-label{color:var(--muted);flex:1;}
  .leg-count{color:var(--text);font-weight:600;}
  .cat-row{display:flex;align-items:center;gap:8px;margin:5px 0;}
  .cat-row svg{flex:none;}
  .cat-label{color:var(--muted);flex:1;}
  .cat-count{color:var(--text);font-weight:600;}
  .leg-sep{margin:10px 0;border-top:1px solid var(--border);}
  .progress-wrap{margin-top:10px;height:8px;border-radius:5px;background:#0b0d11;overflow:hidden;border:1px solid var(--border);}
  .progress-bar{height:100%;background:linear-gradient(90deg,#ff6d00,#ffd600,#00b0ff,#00e676);}
  .progress-txt{margin-top:6px;font-size:11px;color:var(--muted);text-align:right;}

  .locate-btn{
    background:var(--panel);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4);border:1px solid var(--border);
  }
  .locate-btn:hover{background:var(--panel2);}
  .locate-btn.loading svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .geo-wrap{position:relative;width:18px;height:18px;}
  .geo-dot{position:absolute;left:5px;top:5px;width:8px;height:8px;border-radius:50%;background:#00e5ff;border:2px solid #fff;box-shadow:0 0 6px #00e5ff;}
  .geo-ring{position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;background:rgba(0,229,255,.25);animation:pulse 1.8s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(.4);opacity:1;}100%{transform:scale(1.8);opacity:0;}}

  .popup-box{min-width:240px;max-width:270px;font-size:13px;}
  .popup-box h4{margin:0 0 4px;font-size:15px;}
  .popup-box .tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:20px;background:#0b0d11;color:var(--muted);border:1px solid var(--border);margin-bottom:8px;}
  .popup-box .cur{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .popup-box .hint{font-size:10.5px;color:var(--muted);margin-bottom:8px;font-style:italic;}
  .stage-list{max-height:220px;overflow-y:auto;padding-right:2px;}
  .stage-btn .chk{margin-right:4px;}
  .stage-btn{
    display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--panel2);
    color:var(--text);padding:6px 10px;border-radius:8px;margin-bottom:4px;cursor:pointer;font-size:12.5px;
    transition:background .15s;
  }
  .stage-btn:hover{background:#2a3040;}
  .stage-btn.active{background:linear-gradient(90deg,#00b0ff,#00e5ff);color:#04121a;font-weight:700;border-color:transparent;}
  .idx-wrap{margin-top:9px;}
  .idx-wrap label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;}
  .idx-row{display:flex;align-items:center;gap:6px;}
  .idx-row input{
    width:0;flex:1;min-width:0;background:#0b0d11;color:var(--text);
    border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12px;font-family:inherit;
  }
  .idx-row input::-webkit-outer-spin-button,
  .idx-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .idx-sep{color:var(--muted);font-size:12px;flex:none;}
  .idx-out{flex:none;min-width:52px;text-align:right;font-weight:700;font-size:12.5px;color:var(--muted);}

  .obs-wrap{margin-top:8px;}
  .obs-wrap label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;}
  .obs-wrap textarea{
    width:100%;min-height:44px;resize:vertical;background:#0b0d11;color:var(--text);
    border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12px;font-family:inherit;
  }
  .obs-save{
    margin-top:5px;width:100%;padding:6px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);cursor:pointer;font-size:12px;font-weight:600;
  }
  .obs-save:hover{background:#2a3040;}
  .nav-btn{
    display:block;margin-top:8px;padding:8px;border-radius:8px;text-align:center;
    background:linear-gradient(90deg,#1a73e8,#00b0ff);color:#fff;font-weight:700;font-size:12.5px;
    text-decoration:none;
  }
  .nav-btn:hover{filter:brightness(1.15);}

  .toast{
    position:absolute;left:50%;bottom:28px;transform:translateX(-50%);
    background:#1f232c;border:1px solid var(--border);color:var(--text);
    padding:10px 16px;border-radius:10px;font-size:13px;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,.5);
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1;}

  @media (max-width:640px){
    #legend{ right:8px; top:8px; width:212px; }
    #topbar{ padding:12px 12px 26px; }
    #topbar h1{ font-size:15px; }
  }

  /* ── Evidentiere markere ── */
  /* Halo-ul e desenat IN interiorul divIcon-ului, deci ramane constant in pixeli
     la orice zoom (spre deosebire de L.circle, care e ancorat in metri pe teren). */
  .hl-wrap{position:relative;width:100%;height:100%;}
  .hl-wrap svg{filter:drop-shadow(0 0 5px var(--hl)) drop-shadow(0 0 2px var(--hl));}
  .hl-ring{
    position:absolute;left:50%;bottom:0;transform:translate(-50%,38%);
    width:36px;height:17px;border-radius:50%;
    border:2.5px solid var(--hl);box-shadow:0 0 12px var(--hl),inset 0 0 8px var(--hl);
    pointer-events:none;
  }
  .hl-ring::after{
    content:'';position:absolute;inset:-6px;border-radius:50%;
    border:1.5px solid var(--hl);opacity:.55;
    animation:hlpulse 2s ease-out infinite;
  }
  @keyframes hlpulse{0%{transform:scale(.75);opacity:.7;}100%{transform:scale(1.35);opacity:0;}}

  #hlPanel{margin-top:4px;}
  .hl-row{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer;user-select:none;}
  .hl-row .hl-swatch{width:13px;height:13px;border-radius:50%;flex:none;border:2px solid currentColor;}
  .hl-row .hl-name{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hl-row.on .hl-name{color:var(--text);font-weight:600;}
  .hl-row.picking .hl-name{color:var(--accent);}
  .hl-row .hl-n{color:var(--text);font-weight:600;font-size:11.5px;}
  .hl-tools{display:flex;gap:6px;margin-top:8px;}
  .hl-tools button{
    flex:1;padding:5px;border-radius:7px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);cursor:pointer;font-size:11px;font-family:inherit;
  }
  .hl-tools button:hover{background:#2a3040;}
  .sel-banner{
    position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:1500;
    background:var(--accent);color:#04121a;font-weight:700;font-size:12.5px;
    padding:7px 14px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.5);display:none;
  }
  .sel-banner.show{display:block;}
  .locate-btn.picking{background:var(--accent);}
  .hl-btn-row{margin-top:9px;}
  .hl-btn-row label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;}
  .hl-btns{display:flex;gap:5px;}
  .popup-box .hl-btn{
    flex:1;min-width:0;padding:5px 4px;border-radius:8px;
    border:1px solid var(--border);background:var(--panel2);color:var(--muted);
    cursor:pointer;font-size:10.5px;font-weight:600;font-family:inherit;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .popup-box .hl-btn:hover{background:#2a3040;color:var(--text);}

  .leaflet-control-attribution{background:rgba(15,17,21,.7)!important;color:var(--muted)!important;}
  .leaflet-control-attribution a{color:#7fd3ff!important;}
  .leaflet-control-zoom a{background:var(--panel)!important;color:var(--text)!important;border-color:var(--border)!important;}
  .leaflet-control-layers{background:var(--panel)!important;color:var(--text)!important;border:1px solid var(--border)!important;border-radius:10px!important;box-shadow:0 6px 18px rgba(0,0,0,.4)!important;}
  .leaflet-control-layers-toggle{filter:invert(1) brightness(1.6);}
  .leaflet-control-layers-expanded{padding:8px 12px!important;}
  .leaflet-control-layers label{color:var(--text)!important;font-size:12.5px;}
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <h1>Radovanu <span>ITS</span> — Status echipamente</h1>
  <div class="sub" id="subTxt">se incarca datele din Google Sheets…</div>
</div>

<div id="legend" class="expanded">
  <h3 id="legendToggle">
    <span>Progres <b id="pctBig">–</b></span>
    <span id="legend-mini"><span class="mini-dot"></span><span id="miniTxt">–</span></span>
    <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
  </h3>
  <div id="legend-body">
    <div id="catRows"></div>
    <div class="leg-sep"></div>
    <div class="leg-row"><div class="leg-dot" style="background:#9e9e9e"></div><div class="leg-label">Neinceput</div><div class="leg-count" id="c0">0</div></div>
    <div class="leg-row"><div class="leg-dot" style="background:#ff6d00"></div><div class="leg-label">Sub 1/3 bifat</div><div class="leg-count" id="c1">0</div></div>
    <div class="leg-row"><div class="leg-dot" style="background:#ffd600"></div><div class="leg-label">1/3 – 2/3 bifat</div><div class="leg-count" id="c2">0</div></div>
    <div class="leg-row"><div class="leg-dot" style="background:#00b0ff"></div><div class="leg-label">Peste 2/3 bifat</div><div class="leg-count" id="c3">0</div></div>
    <div class="leg-row"><div class="leg-dot" style="background:#00e676"></div><div class="leg-label">Finalizat</div><div class="leg-count" id="c4">0</div></div>
    <div class="progress-wrap"><div class="progress-bar" id="pbar" style="width:0%"></div></div>
    <div class="progress-txt" id="ptxt">–</div>
    <div class="leg-sep"></div>
    <div id="hlPanel">
      <div id="hlRows"></div>
      <div class="hl-tools">
        <button id="hlCopy" title="Copiaza raportul cu metrii">📋 Raport</button>
        <button id="hlClear" title="Revino la metrajul din teren">↺ Reset</button>
      </div>
    </div>
  </div>
</div>

<div class="sel-banner" id="selBanner"></div>
<div class="toast" id="toast"></div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
// Daca actualizezi codul in ACELASI proiect Apps Script si redeployezi aceeasi
// implementare (Manage deployments -> Edit -> New version), URL-ul ramane valabil.
// Deployment propriu, legat de "Radovanu ITS — copie Stefan" din Drive-ul tau.
// Verificat: scrierea ajunge in copie, Sheet-ul original ramane neatins.
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwKxnzJa-u_J08yMZUa3JukFTXve25JAhleOcx11ccKnxxk83-4-rUk3ZezZgBu9gcQxg/exec';

// Pune pe true daca vrei harta doar de citit (bifele si observatiile blocate).
const READONLY = false;

const COLORS = { none:'#9e9e9e', low:'#ff6d00', mid:'#ffd600', high:'#00b0ff', done:'#00e676' };
const CAT_LABELS = { CT:'Cutii de transmisiuni', SIC:'Statii autobuz (SIC)', PIV:'Panouri PIV', CV:'Camere bullet', PTZ:'Camere PTZ', LPR:'Camere LPR' };

// ── Cablu de tras (metri liniari, din notitele de teren) ────────────────────
// Sursa unica de adevar: culorile de mai jos se CALCULEAZA din metrajul asta,
// nu se tin liste separate. Schimbi un metraj sau pragul -> harta se aliniaza.
// 0 = notat "OK" pe hartie, adica nu mai e cablu de tras.
const PRAG_M = 30;   // peste = rosu, pana la (inclusiv) = galben
const CABLU_M = {
  // LPR
  LPR001:5, LPR002:5, LPR003:130, LPR004:5, LPR005:5, LPR006:5, LPR007:5,
  // CV
  CV001:25, CV002:70, CV003:60, CV004:60, CV005:20, CV006:30, CV007:25,
  CV008:60, CV009:30, CV010:0,  CV011:60, CV012:0,  CV013:0,  CV014:40,
  CV015:0,  CV016:60, CV017:0,  CV018:90, CV019:30, CV020:60, CV021:10,
  CV022:40,   // 20 m tronson + 20 m traversare, notate pe pagini diferite
  CV023:5,
  // PTZ
  PTZ001:60, PTZ002:5, PTZ003:0, PTZ004:0, PTZ005:140, PTZ006:0, PTZ007:0
};

// ── Evidentieri (grupuri de markere incercuite) ─────────────────────────────
const HIGHLIGHT_GROUPS = [
  { id:'rosu',   label:`Peste ${PRAG_M} m`,   color:'#ff1744' },
  { id:'galben', label:`Pana la ${PRAG_M} m`, color:'#ffea00' },
  { id:'ok',     label:'OK (fara cablu)',     color:'#00e676' }
];
const HL_STORE = 'radovanu_its_highlights';

// Din metraj -> grup. Ce nu e in CABLU_M (CT, SIC, PIV) ramane neevidentiat.
function derivedHL(){
  const out = {};
  Object.keys(CABLU_M).forEach(n => {
    const m = CABLU_M[n];
    out[n] = m > PRAG_M ? 'rosu' : (m > 0 ? 'galben' : 'ok');
  });
  return out;
}

// name -> group id. Un marker apartine unui singur grup (ultimul castiga).
let HL = {};
let hlVisible = {};                       // group id -> bool (afisat sau nu)
let pickGroup = null;                     // grupul in care se adauga la click pe marker

function loadHL(){
  HIGHLIGHT_GROUPS.forEach(g => hlVisible[g.id] = true);
  HL = derivedHL();
  try{
    // Ce ai modificat manual bate metrajul din cod — dar doar daca exista ceva.
    // Un obiect gol inseamna "fara suprascriere", nu "fara evidentieri".
    const raw = localStorage.getItem(HL_STORE);
    const saved = raw ? JSON.parse(raw) : null;
    if (saved && Object.keys(saved).length) HL = saved;
  }catch(e){ console.warn('Nu s-au putut citi evidentierile salvate', e); }
}
function saveHL(){
  try{ localStorage.setItem(HL_STORE, JSON.stringify(HL)); }
  catch(e){ toast('⚠ Nu s-au putut salva evidentierile local', 4000); }
}
function hlOf(name){
  const gid = HL[name];
  if (!gid || !hlVisible[gid]) return null;
  return HIGHLIGHT_GROUPS.find(g => g.id === gid) || null;
}
function setHL(name, gid){
  if (gid === null || HL[name] === gid) delete HL[name];
  else HL[name] = gid;
  saveHL();
  const p = POINTS[name];
  if (p) refreshMarker(p, !!document.querySelector('.leaflet-popup'));
  updateHlPanel();
}

// Starea aplicatiei — totul vine LIVE din Sheet (nume, coordonate, bife, observatii)
let FIELDS = [];        // [{col, label}] — coloanele de bife, in ordinea din sheet
const POINTS = {};      // name -> {name, cat, lat, lon, obs, vals[]}
const markers = {};     // name -> L.marker
let loaded = false;

// ── Utilitare ────────────────────────────────────────────────────────────────
function parseDMS(s){
  if (typeof s === 'number') return s;
  s = String(s || '').trim().replace(/,/g, '.');
  const m = s.match(/(-?\d+)\s*[°º]\s*(\d+)\s*[′'’`]\s*([\d.]+)/);
  if (m) return (+m[1]) + (+m[2])/60 + (+m[3])/3600;
  const f = parseFloat(s);
  return isNaN(f) ? null : f;
}
function catOf(name){
  const n = name.toUpperCase();
  if (n.startsWith('PIV')) return 'PIV';
  if (n.startsWith('PTZ')) return 'PTZ';
  if (n.startsWith('LPR')) return 'LPR';
  if (n.startsWith('CV'))  return 'CV';
  if (n.includes('SIC'))   return 'SIC';
  return 'CT';
}
function applicable(p){ return p.vals.filter(v => v !== 'NA').length; }
function doneCount(p){  return p.vals.filter(v => v === true).length; }
function bucketOf(p){
  const t = applicable(p), d = doneCount(p);
  if (t === 0 || d === 0) return 0;
  if (d === t) return 4;
  const pct = d / t;
  if (pct <= 1/3) return 1;
  if (pct <= 2/3) return 2;
  return 3;
}
function colorOf(p){ return [COLORS.none, COLORS.low, COLORS.mid, COLORS.high, COLORS.done][bucketOf(p)]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Harta ─────────────────────────────────────────────────────────────────
const map = L.map('map', {zoomControl:false}).setView([44.183, 26.517], 13);
L.control.zoom({position:'topleft'}).addTo(map);

const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap', maxZoom: 19
}).addTo(map);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: '&copy; Esri', maxZoom: 19
});
// Grupuri pe categorii — toggle on/off din controlul de layere.
// Doar local (in memorie): la refresh toate sunt vizibile din nou.
const catGroups = {
  CT:  L.layerGroup().addTo(map),
  SIC: L.layerGroup().addTo(map),
  PIV: L.layerGroup().addTo(map),
  CV:  L.layerGroup().addTo(map),
  PTZ: L.layerGroup().addTo(map),
  LPR: L.layerGroup().addTo(map)
};
L.control.layers(
  {'Strada': osm, 'Satelit': sat},
  {
    'Cutii de transmisiuni': catGroups.CT, 'Statii autobuz (SIC)': catGroups.SIC, 'Panouri PIV': catGroups.PIV,
    'Camere bullet': catGroups.CV, 'Camere PTZ': catGroups.PTZ, 'Camere LPR': catGroups.LPR
  },
  {position:'topleft'}
).addTo(map);

// ── Icoane ────────────────────────────────────────────────────────────────
function boxSvg(color, w){
  w = w || 30;
  return `<svg width="${w}" height="${Math.round(w*34/30)}" viewBox="0 0 30 34" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="15" cy="31" rx="7" ry="2.4" fill="#000" opacity="0.35"/>
    <rect x="4" y="4" width="22" height="20" rx="3" fill="${color}" stroke="#0b0d11" stroke-width="1.5"/>
    <rect x="8" y="9" width="6" height="4.5" rx="1" fill="#0b0d11" opacity="0.55"/>
    <rect x="16" y="9" width="6" height="4.5" rx="1" fill="#0b0d11" opacity="0.55"/>
    <rect x="8" y="16" width="14" height="3" rx="1" fill="#0b0d11" opacity="0.4"/>
    <path d="M15 24 L15 29" stroke="#0b0d11" stroke-width="2.5" stroke-linecap="round"/>
  </svg>`;
}
function busSvg(color, w){
  w = w || 32;
  return `<svg width="${w}" height="${Math.round(w*36/32)}" viewBox="0 0 32 36" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="16" cy="33" rx="8" ry="2.4" fill="#000" opacity="0.35"/>
    <rect x="3" y="7" width="26" height="15" rx="4" fill="${color}" stroke="#0b0d11" stroke-width="1.5"/>
    <rect x="6" y="10" width="5" height="5" rx="1" fill="#eaf6ff" opacity="0.9"/>
    <rect x="13" y="10" width="5" height="5" rx="1" fill="#eaf6ff" opacity="0.9"/>
    <rect x="20" y="10" width="5" height="5" rx="1" fill="#eaf6ff" opacity="0.9"/>
    <rect x="3" y="19" width="26" height="3" fill="#0b0d11" opacity="0.35"/>
    <circle cx="9" cy="24.5" r="3" fill="#111418" stroke="${color}" stroke-width="1.4"/>
    <circle cx="23" cy="24.5" r="3" fill="#111418" stroke="${color}" stroke-width="1.4"/>
    <path d="M16 22 L16 30" stroke="#0b0d11" stroke-width="2.4" stroke-linecap="round"/>
  </svg>`;
}
function pivSvg(color, w){
  w = w || 30;
  return `<svg width="${w}" height="${Math.round(w*38/30)}" viewBox="0 0 30 38" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="15" cy="35" rx="7" ry="2.2" fill="#000" opacity="0.35"/>
    <rect x="13" y="15" width="4" height="19" rx="1" fill="#3a4150" stroke="#0b0d11" stroke-width="1"/>
    <rect x="3" y="2" width="24" height="15" rx="2.5" fill="${color}" stroke="#0b0d11" stroke-width="1.5"/>
    <rect x="6" y="5" width="18" height="2.4" rx="1.2" fill="#0b0d11" opacity="0.55"/>
    <rect x="6" y="9" width="13" height="2.4" rx="1.2" fill="#0b0d11" opacity="0.4"/>
    <rect x="6" y="13" width="16" height="1.6" rx="0.8" fill="#0b0d11" opacity="0.3"/>
  </svg>`;
}
// Camera PTZ (speed dome) — dom semisferic pe suport
function ptzSvg(color, w){
  w = w || 30;
  return `<svg width="${w}" height="${Math.round(w*36/30)}" viewBox="0 0 30 36" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="15" cy="33" rx="7" ry="2.3" fill="#000" opacity="0.35"/>
    <rect x="13.2" y="20" width="3.6" height="13" rx="1" fill="#3a4150" stroke="#0b0d11" stroke-width="1"/>
    <rect x="6" y="4" width="18" height="4" rx="2" fill="#3a4150" stroke="#0b0d11" stroke-width="1.3"/>
    <path d="M5 8 h20 a10 10 0 0 1 -20 0 z" fill="${color}" stroke="#0b0d11" stroke-width="1.5"/>
    <circle cx="15" cy="13" r="3.6" fill="#0b0d11" opacity="0.75"/>
    <circle cx="13.8" cy="11.8" r="1.1" fill="#eaf6ff" opacity="0.85"/>
  </svg>`;
}
// Camera bullet (fixa) — corp cilindric pe brat. Folosita si pentru CV, si pentru LPR.
function bulletSvg(color, w){
  w = w || 32;
  return `<svg width="${w}" height="${Math.round(w*36/32)}" viewBox="0 0 32 36" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="16" cy="33" rx="7.5" ry="2.3" fill="#000" opacity="0.35"/>
    <rect x="14.2" y="18" width="3.6" height="15" rx="1" fill="#3a4150" stroke="#0b0d11" stroke-width="1"/>
    <path d="M16 12 L16 19" stroke="#3a4150" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="5" y="6" width="17" height="10" rx="4" fill="${color}" stroke="#0b0d11" stroke-width="1.5"/>
    <rect x="21" y="8.5" width="4.5" height="5" rx="1.4" fill="#0b0d11" opacity="0.75"/>
    <circle cx="25" cy="11" r="1.5" fill="#eaf6ff" opacity="0.85"/>
    <rect x="8" y="8.6" width="8" height="1.8" rx="0.9" fill="#0b0d11" opacity="0.4"/>
  </svg>`;
}
function svgFor(p, color, w){
  if (p.cat === 'SIC') return busSvg(color, w);
  if (p.cat === 'PIV') return pivSvg(color, w);
  if (p.cat === 'PTZ') return ptzSvg(color, w);
  if (p.cat === 'CV' || p.cat === 'LPR') return bulletSvg(color, w);
  return boxSvg(color, w);
}
function makeIcon(p){
  const color = colorOf(p);
  const sizes = { CT:[30,34], SIC:[32,36], PIV:[30,38], CV:[32,36], PTZ:[30,36], LPR:[32,36] };
  const [iw, ih] = sizes[p.cat];
  // Culoarea markerului ramane cea de progres; evidentierea doar il incercuieste.
  const g = hlOf(p.name);
  const html = g
    ? `<div class="hl-wrap" style="--hl:${g.color}"><div class="hl-ring"></div>${svgFor(p, color)}</div>`
    : svgFor(p, color);
  return L.divIcon({
    className:'', html,
    iconSize:[iw, ih], iconAnchor:[iw/2, ih-2], popupAnchor:[0, -(ih-4)]
  });
}

// ── Popup ─────────────────────────────────────────────────────────────────
function popupHtml(p){
  const t = applicable(p), d = doneCount(p);
  const label = t === 0 ? 'Fara etape' : (d === 0 ? 'Neinceput' : (d === t ? 'Finalizat' : `${d}/${t} etape bifate`));
  let rows = '';
  FIELDS.forEach((f, i) => {
    const v = p.vals[i];
    if (v === 'NA') return;
    rows += `<div class="stage-btn ${v ? 'active' : ''}" data-idx="${i}">
      <span class="chk">${v ? '☑' : '☐'}</span> ${esc(f.label)}
    </div>`;
  });
  return `<div class="popup-box">
    <h4>${esc(p.name)}</h4>
    <span class="tag">${CAT_LABELS[p.cat]}</span>
    ${cabluHtml(p)}
    <div class="cur">Status curent: <b>${label}</b></div>
    <div class="hint">Bifele sunt independente — pot fi in orice ordine</div>
    <div class="stage-list">${rows}</div>
    ${idxHtml(p)}
    <div class="obs-wrap">
      <label>Observatii</label>
      <textarea id="obsTxt" placeholder="scrie o observatie…">${esc(parseObs(p.obs).text)}</textarea>
      <button class="obs-save" id="obsSave">💾 Salveaza index + observatie</button>
    </div>
    ${hlButtonsHtml(p)}
    <a class="nav-btn" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank">🗺 Navigheaza aici</a>
  </div>`;
}

// ── Index tambur (metri reali) ───────────────────────────────────────────
// Nu avem coloane dedicate in Sheet, asa ca indexul se tine in campul de
// observatii, pe prima pozitie, in forma "IDX 1250-1310 | restul textului".
// Asa merge cu Apps Script-ul existent, fara coloane noi.
const IDX_RE = /^\s*IDX\s*(\d+(?:[.,]\d+)?)\s*-\s*(\d+(?:[.,]\d+)?)\s*(?:\|\s*)?/i;

function parseObs(obs){
  const s = String(obs || '');
  const m = s.match(IDX_RE);
  if (!m) return { start:'', end:'', text:s };
  return { start:m[1].replace(',','.'), end:m[2].replace(',','.'), text:s.slice(m[0].length) };
}
function buildObs(start, end, text){
  const a = String(start).trim(), b = String(end).trim();
  const t = String(text || '').trim();
  if (a === '' || b === '') return t;
  return `IDX ${a}-${b}${t ? ' | ' + t : ''}`;
}
// Metri reali consumati = final - inceput. null daca nu e completat corect.
function realiOf(p){
  const {start, end} = parseObs(p.obs);
  if (start === '' || end === '') return null;
  const d = parseFloat(end) - parseFloat(start);
  return isNaN(d) ? null : d;
}

function cabluHtml(p){
  const m = CABLU_M[p.name];
  const real = realiOf(p);
  let est = '';
  if (m === undefined) est = '';
  else if (m === 0) est = `<div class="cur">Cablu de tras: <b style="color:#00e676">nu e cazul (OK)</b></div>`;
  else {
    const col = m > PRAG_M ? '#ff1744' : '#ffea00';
    est = `<div class="cur">Estimat pe teren: <b style="color:${col}">${m} m</b></div>`;
  }
  if (real === null) return est;
  // Cu cat difera realul fata de estimarea din carnet
  const dif = (m === undefined || m === 0) ? null : real - m;
  const semn = dif === null ? '' :
    (dif === 0 ? ' (exact cat estimat)' :
     ` (${dif > 0 ? '+' : ''}${Math.round(dif*10)/10} m fata de estimat)`);
  return est + `<div class="cur">Consumat real: <b style="color:var(--accent)">${Math.round(real*10)/10} m</b>${semn}</div>`;
}

function idxHtml(p){
  const {start, end} = parseObs(p.obs);
  return `<div class="idx-wrap">
    <label>Index tambur (metri reali)</label>
    <div class="idx-row">
      <input id="idxStart" type="number" inputmode="decimal" placeholder="inceput" value="${esc(start)}">
      <span class="idx-sep">→</span>
      <input id="idxEnd" type="number" inputmode="decimal" placeholder="final" value="${esc(end)}">
      <span class="idx-out" id="idxOut">–</span>
    </div>
  </div>`;
}

function hlButtonsHtml(p){
  const cur = HL[p.name] || null;
  const btns = HIGHLIGHT_GROUPS.map(g => {
    const on = cur === g.id;
    return `<button class="hl-btn ${on ? 'on' : ''}" data-gid="${g.id}" title="${esc(g.label)}"
      style="${on ? `border-color:${g.color};color:${g.color};background:${g.color}22` : ''}">
      ${on ? '✦' : '○'} ${esc(g.label)}
    </button>`;
  }).join('');
  return `<div class="hl-btn-row"><label>Incercuire</label><div class="hl-btns">${btns}</div></div>`;
}

function wirePopup(p){
  document.querySelectorAll('.stage-btn').forEach(btn => {
    btn.onclick = () => toggleFlag(p, parseInt(btn.dataset.idx, 10));
  });
  const save = document.getElementById('obsSave');
  if (save) save.onclick = () => saveObs(p);

  // Diferenta se calculeaza in timp ce scrii, inainte de salvare
  const s = document.getElementById('idxStart'), e = document.getElementById('idxEnd');
  const out = document.getElementById('idxOut');
  const calc = () => {
    if (!out) return;
    const a = parseFloat(s.value), b = parseFloat(e.value);
    if (isNaN(a) || isNaN(b)){ out.textContent = '–'; out.style.color = ''; return; }
    const d = Math.round((b - a) * 10) / 10;
    out.textContent = d + ' m';
    out.style.color = d < 0 ? '#ff1744' : 'var(--accent)';
  };
  if (s && e){ s.oninput = calc; e.oninput = calc; calc(); }
  document.querySelectorAll('.hl-btn').forEach(btn => {
    btn.onclick = () => setHL(p.name, btn.dataset.gid);
  });
}

// ── Scriere in Sheet ──────────────────────────────────────────────────────
async function toggleFlag(p, idx){
  if (READONLY){ toast('🔒 Mod citire — harta e legata inca de Sheet-ul original', 4000); return; }
  const f = FIELDS[idx];
  const newVal = p.vals[idx] !== true;
  p.vals[idx] = newVal;
  refreshMarker(p, true);
  updateLegend();
  toast('Se salveaza…');
  try{
    const res = await fetch(`${SCRIPT_URL}?action=write&name=${encodeURIComponent(p.name)}&col=${f.col}&value=${newVal}`);
    const out = await res.json();
    if (out.error) { toast('⚠ Server: ' + out.error, 6000); return; }
    toast(`✓ ${p.name} · ${f.label} → ${newVal ? 'DA' : 'NU'}`);
  }catch(err){
    toast('⚠ Nu s-a putut sincroniza: ' + err.message, 5000);
  }
}

async function saveObs(p){
  if (READONLY){ toast('🔒 Mod citire — harta e legata inca de Sheet-ul original', 4000); return; }
  const txt = document.getElementById('obsTxt');
  if (!txt) return;
  const s = document.getElementById('idxStart'), e = document.getElementById('idxEnd');
  const a = s ? s.value.trim() : '', b = e ? e.value.trim() : '';
  if ((a === '') !== (b === '')){
    toast('⚠ Completeaza si indexul de inceput, si pe cel final', 4000);
    return;
  }
  if (a !== '' && parseFloat(b) < parseFloat(a)){
    toast('⚠ Indexul final e mai mic decat cel de inceput', 4000);
    return;
  }
  const val = buildObs(a, b, txt.value);
  p.obs = val;
  refreshMarker(p, false);
  toast('Se salveaza observatia…');
  try{
    const res = await fetch(`${SCRIPT_URL}?action=note&name=${encodeURIComponent(p.name)}&value=${encodeURIComponent(val)}`);
    const out = await res.json();
    if (out.error) { toast('⚠ Server: ' + out.error, 6000); return; }
    toast(`✓ Observatie salvata pentru ${p.name}`);
  }catch(err){
    toast('⚠ Nu s-a putut salva: ' + err.message, 5000);
  }
}

// ── Incarcare / sincronizare din Sheet ────────────────────────────────────
function refreshMarker(p, rewire){
  const m = markers[p.name];
  if (!m) return;
  m.setIcon(makeIcon(p));
  m.setPopupContent(popupHtml(p));
  if (rewire) wirePopup(p);
}

async function loadData(){
  try{
    const res = await fetch(SCRIPT_URL + '?t=' + Date.now());
    const data = await res.json();
    if (data.error) { toast('⚠ Server: ' + data.error, 6000); return; }
    FIELDS = data.fields || [];

    // Daca un popup e deschis, nu suprascriem (sa nu piarda utilizatorul textul din Observatii)
    const popupOpen = loaded && document.querySelector('.leaflet-popup');

    const seen = {};
    (data.points || []).forEach(row => {
      const lat = parseDMS(row.lat), lon = parseDMS(row.lon);
      if (lat == null || lon == null) return;
      seen[row.name] = true;
      let p = POINTS[row.name];
      if (!p){
        p = POINTS[row.name] = { name: row.name, cat: catOf(row.name), lat, lon, obs: row.obs, vals: row.vals };
        const m = L.marker([lat, lon], {icon: makeIcon(p)})
          .addTo(catGroups[p.cat])
          .bindPopup(popupHtml(p), {closeButton:true, maxWidth:290});
        m.on('popupopen', () => wirePopup(p));
        m.on('click', () => { if (pickGroup) setHL(p.name, pickGroup); });
        if (pickGroup) m.unbindPopup();   // marker aparut in timpul selectiei
        markers[p.name] = m;
      } else if (!popupOpen){
        p.lat = lat; p.lon = lon; p.obs = row.obs; p.vals = row.vals;
        markers[p.name].setLatLng([lat, lon]);
        refreshMarker(p, false);
      }
    });
    // Sterge punctele care nu mai exista in sheet
    if (!popupOpen){
      Object.keys(POINTS).forEach(name => {
        if (!seen[name]){ catGroups[POINTS[name].cat].removeLayer(markers[name]); delete markers[name]; delete POINTS[name]; }
      });
    }
    loaded = true;
    updateLegend();
  }catch(err){
    console.warn('Eroare incarcare date', err);
    toast('⚠ Nu s-a putut conecta la Sheet: ' + err.message, 5000);
  }
}

// ── Legenda ──────────────────────────────────────────────────────────────
function updateLegend(){
  const pts = Object.values(POINTS);
  const buckets = [0,0,0,0,0];
  const cats = { CT:{done:0,total:0}, SIC:{done:0,total:0}, PIV:{done:0,total:0}, CV:{done:0,total:0}, PTZ:{done:0,total:0}, LPR:{done:0,total:0} };
  pts.forEach(p => {
    buckets[bucketOf(p)]++;
    cats[p.cat].total++;
    if (applicable(p) > 0 && doneCount(p) === applicable(p)) cats[p.cat].done++;
  });
  buckets.forEach((c,i) => { const el = document.getElementById('c'+i); if (el) el.textContent = c; });

  const catRows = document.getElementById('catRows');
  catRows.innerHTML = ['CT','SIC','PIV','CV','PTZ','LPR'].map(cat => {
    const icon = svgFor({cat}, COLORS.done, 18);
    return `<div class="cat-row">${icon}<div class="cat-label">${CAT_LABELS[cat]}</div><div class="cat-count">${cats[cat].done}/${cats[cat].total}</div></div>`;
  }).join('');

  const total = pts.length;
  const done = buckets[4];
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('pctBig').textContent = pct + '%';
  document.getElementById('ptxt').textContent = `${done} / ${total} finalizate`;
  document.getElementById('miniTxt').textContent = `${done}/${total}`;
  document.getElementById('subTxt').textContent =
    `${cats.CT.total} CT · ${cats.SIC.total} statii · ${cats.PIV.total} PIV · ${cats.CV.total} bullet · ${cats.PTZ.total} PTZ · ${cats.LPR.total} LPR — sincronizare live cu Google Sheets`;
}

// ── Panou evidentieri + mod de selectare pe harta ────────────────────────
function refreshAllIcons(){
  Object.values(POINTS).forEach(p => {
    const m = markers[p.name];
    if (m) m.setIcon(makeIcon(p));
  });
}

function updateHlPanel(){
  const counts = {}, metri = {};
  HIGHLIGHT_GROUPS.forEach(g => { counts[g.id] = 0; metri[g.id] = 0; });
  Object.keys(HL).forEach(n => {
    const gid = HL[n];
    if (!(gid in counts)) return;
    counts[gid]++;
    metri[gid] += CABLU_M[n] || 0;
  });

  document.getElementById('hlRows').innerHTML = HIGHLIGHT_GROUPS.map(g => {
    const vis = hlVisible[g.id], picking = pickGroup === g.id;
    const val = metri[g.id] ? `${counts[g.id]} · ${metri[g.id]} m` : `${counts[g.id]}`;
    return `<div class="hl-row ${counts[g.id] ? 'on' : ''} ${picking ? 'picking' : ''}" data-gid="${g.id}">
      <div class="hl-swatch" data-act="vis" title="Arata / ascunde"
           style="color:${g.color};background:${vis ? g.color : 'transparent'}"></div>
      <div class="hl-name" data-act="pick" title="Alege markere pe harta">${esc(g.label)}</div>
      <div class="hl-n">${val}</div>
    </div>`;
  }).join('');

  document.querySelectorAll('.hl-row').forEach(row => {
    const gid = row.dataset.gid;
    row.querySelector('[data-act="vis"]').onclick = e => {
      e.stopPropagation();
      hlVisible[gid] = !hlVisible[gid];
      refreshAllIcons(); updateHlPanel();
    };
    row.querySelector('[data-act="pick"]').onclick = e => {
      e.stopPropagation();
      pickGroup === gid ? stopPick() : startPick(gid);
    };
  });
}

function startPick(gid){
  pickGroup = gid;
  const g = HIGHLIGHT_GROUPS.find(x => x.id === gid);
  // Scoatem popup-urile cat timp alegem, ca un click sa insemne doar "incercuieste".
  Object.values(markers).forEach(m => { m.closePopup(); m.unbindPopup(); });
  const b = document.getElementById('selBanner');
  b.textContent = `✦ Alege markere pentru „${g.label}” — click pe harta, ESC pentru gata`;
  b.style.background = g.color;
  b.classList.add('show');
  document.getElementById('pickBtn').classList.add('picking');
  updateHlPanel();
}

function stopPick(){
  pickGroup = null;
  Object.values(POINTS).forEach(p => {
    const m = markers[p.name];
    if (m && !m.getPopup()) {
      m.bindPopup(popupHtml(p), {closeButton:true, maxWidth:290});
      m.on('popupopen', () => wirePopup(p));
    }
  });
  document.getElementById('selBanner').classList.remove('show');
  document.getElementById('pickBtn').classList.remove('picking');
  updateHlPanel();
}

const pickCtrl = L.control({position:'topleft'});
pickCtrl.onAdd = function(){
  const btn = L.DomUtil.create('div','locate-btn');
  btn.id = 'pickBtn'; btn.title = 'Evidentiere markere';
  btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eef1f6"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/>
    <circle cx="12" cy="12" r="2.5" fill="#eef1f6"/></svg>`;
  L.DomEvent.disableClickPropagation(btn);
  L.DomEvent.on(btn, 'click', () => {
    pickGroup ? stopPick() : startPick(HIGHLIGHT_GROUPS[0].id);
  });
  return btn;
};
pickCtrl.addTo(map);

document.addEventListener('keydown', e => { if (e.key === 'Escape' && pickGroup) stopPick(); });

// Raport text, gata de trimis pe WhatsApp / pus in deviz.
document.getElementById('hlCopy').onclick = () => {
  const txt = HIGHLIGHT_GROUPS.map(g => {
    const names = Object.keys(HL).filter(n => HL[n] === g.id).sort();
    const suma = names.reduce((s,n) => s + (CABLU_M[n] || 0), 0);
    const cap = g.id === 'ok'
      ? `${g.label} (${names.length} buc.)`
      : `${g.label} — ${names.length} buc., ${suma} m estimat`;
    const linii = names.map(n => {
      const est = CABLU_M[n] ? ' — ' + CABLU_M[n] + ' m' : '';
      const r = POINTS[n] ? realiOf(POINTS[n]) : null;
      return `  ${n}${est}${r !== null ? ` (real ${Math.round(r*10)/10} m)` : ''}`;
    }).join('\n');
    return cap + '\n' + linii;
  }).join('\n\n');
  const total = Object.keys(HL).reduce((s,n) => s + (CABLU_M[n] || 0), 0);
  const totalReal = Object.keys(HL).reduce((s,n) => {
    const r = POINTS[n] ? realiOf(POINTS[n]) : null;
    return s + (r === null ? 0 : r);
  }, 0);
  const cuIndex = Object.keys(HL).filter(n => POINTS[n] && realiOf(POINTS[n]) !== null).length;
  const linieReal = cuIndex
    ? `\nDIN INDEX (${cuIndex} din ${Object.keys(HL).length} elemente): ${Math.round(totalReal*10)/10} m`
    : '';
  navigator.clipboard.writeText(`Cablu de tras — Radovanu ITS\n\n${txt}\n\nTOTAL ESTIMAT: ${total} m${linieReal}`)
    .then(() => toast('✓ Raport copiat in clipboard', 3500))
    .catch(() => toast('⚠ Clipboard blocat de browser', 4000));
};

// ── Toast ────────────────────────────────────────────────────────────────
let toastTimer = null;
function toast(msg, dur=2200){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

// ── Geolocalizare ────────────────────────────────────────────────────────
let _geoWatchId = null, _geoMarker = null, _geoAccCircle = null;
const locateIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eef1f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>`;
const locateIconActive = locateIcon.replace(/#eef1f6/g,'#00e5ff');
const locateIconSpin = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2.2" stroke-linecap="round"><path d="M12 2a10 10 0 0 1 10 10"/></svg>`;

const geoCtrl = L.control({position:'topleft'});
geoCtrl.onAdd = function() {
  const btn = L.DomUtil.create('div','locate-btn');
  btn.id = 'locateBtn'; btn.title = 'Localizare curenta'; btn.innerHTML = locateIcon;
  L.DomEvent.disableClickPropagation(btn);
  L.DomEvent.on(btn, 'click', toggleGeo);
  return btn;
};
geoCtrl.addTo(map);

function geoSuccess(pos) {
  const {latitude:lat, longitude:lon, accuracy} = pos.coords;
  const latlng = L.latLng(lat, lon);
  const dotHtml = `<div class="geo-wrap"><div class="geo-ring"></div><div class="geo-dot"></div></div>`;
  if (!_geoMarker) {
    _geoMarker = L.marker(latlng, {icon:L.divIcon({className:'',html:dotHtml,iconSize:[18,18],iconAnchor:[9,9]}), zIndexOffset:1000, interactive:false}).addTo(map);
    _geoAccCircle = L.circle(latlng, {radius:accuracy, color:'#00e5ff', weight:1.5, opacity:0.5, fillColor:'#00e5ff', fillOpacity:0.12, interactive:false}).addTo(map);
    map.setView(latlng, Math.max(map.getZoom(), 16));
  } else {
    _geoMarker.setLatLng(latlng);
    _geoAccCircle.setLatLng(latlng).setRadius(accuracy);
  }
  const btn = document.getElementById('locateBtn');
  btn.innerHTML = locateIconActive; btn.classList.remove('loading'); btn.classList.add('active');
}
function geoError(err) {
  const btn = document.getElementById('locateBtn');
  btn.innerHTML = locateIcon; btn.classList.remove('loading','active');
  stopGeo();
  const msgs = {1:'Acces la locatie refuzat.',2:'Locatie indisponibila.',3:'Timeout geolocation.'};
  toast('⚠ ' + (msgs[err.code] || 'Eroare geolocation.'), 4000);
}
function stopGeo() {
  if (_geoWatchId !== null) { navigator.geolocation.clearWatch(_geoWatchId); _geoWatchId = null; }
  if (_geoMarker)    { _geoMarker.remove();    _geoMarker = null; }
  if (_geoAccCircle) { _geoAccCircle.remove(); _geoAccCircle = null; }
}
function toggleGeo() {
  if (!navigator.geolocation) { toast('⚠ Browserul nu suporta geolocation.', 4000); return; }
  if (_geoWatchId !== null) {
    stopGeo();
    const btn = document.getElementById('locateBtn');
    btn.innerHTML = locateIcon; btn.classList.remove('loading','active');
    return;
  }
  const btn = document.getElementById('locateBtn');
  btn.innerHTML = locateIconSpin; btn.classList.add('loading'); btn.classList.remove('active');
  _geoWatchId = navigator.geolocation.watchPosition(geoSuccess, geoError, {enableHighAccuracy:true, maximumAge:5000, timeout:15000});
}

// ── Start ────────────────────────────────────────────────────────────────
loadHL();
updateHlPanel();
updateLegend();
loadData();
setInterval(loadData, 60000);
</script>
</body>
