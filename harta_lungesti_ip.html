<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Lungesti IP — proiect vs teren</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --text:#eef1f6; --muted:#8a92a3;
    --border:#2a2f3a; --accent:#ffd600; --ok:#00e676; --warn:#ff9100; --bad:#ff5252;
    --led:#ffd400; --fv:#1aa34a; --col:#e0201b; --jt:#4fc3f7; --mt:#ff9100;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #map{position:absolute;top:0;left:0;right:0;bottom:0;}

  #topbar{position:absolute;top:0;left:0;right:0;z-index:1000;
    background:linear-gradient(180deg,rgba(15,17,21,.92),rgba(15,17,21,0));padding:14px 16px 30px;pointer-events:none;}
  #topbar h1{margin:0;font-size:17px;font-weight:700;pointer-events:auto;}
  #topbar h1 span{color:var(--accent);}
  #topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;pointer-events:auto;}

  #legend{position:absolute;right:12px;top:12px;z-index:1000;background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:14px;width:250px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100vw - 24px);}
  #legend h3{margin:0;font-size:13px;display:flex;align-items:center;cursor:pointer;user-select:none;gap:8px;}
  #legend.expanded h3{margin-bottom:10px;}
  .chev{margin-left:auto;color:var(--muted);transition:transform .25s ease;flex:none;}
  .collapsed .chev{transform:rotate(-90deg);}
  #legend-body{overflow:hidden;max-height:1000px;transition:max-height .25s ease,opacity .2s;opacity:1;}
  #legend.collapsed{padding:9px 14px;border-radius:22px;}
  #legend.collapsed #legend-body{max-height:0;opacity:0;}
  .leg-row{display:flex;align-items:center;gap:9px;margin:6px 0;cursor:pointer;user-select:none;}
  .leg-row.off{opacity:.35;}
  .leg-sym{width:18px;display:flex;justify-content:center;flex:none;}
  .leg-label{color:var(--muted);flex:1;}
  .leg-count{font-weight:600;}
  .leg-sep{margin:10px 0;border-top:1px solid var(--border);}
  .leg-note{font-size:11px;color:var(--muted);line-height:1.4;}
  .leg-tools{display:flex;gap:6px;margin-top:10px;}
  .leg-tools button{flex:1;padding:6px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;font-size:11.5px;font-weight:600;}

  #lst{position:absolute;left:12px;bottom:12px;z-index:1000;background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:12px;width:320px;max-width:calc(100vw - 24px);font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.45);}
  #lst h3{margin:0;font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
  #lst-body{overflow:hidden;max-height:400px;transition:max-height .25s ease,opacity .2s;opacity:1;margin-top:9px;}
  #lst.collapsed #lst-body{max-height:0;opacity:0;margin-top:0;}
  #q{width:100%;background:#0b0d11;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;margin-bottom:6px;}
  #lstScroll{max-height:300px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:3px;}
  .grp{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:8px 0 4px;}
  .row{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:7px;background:#0b0d11;border:1px solid var(--border);margin-bottom:3px;font-size:11.5px;cursor:pointer;}
  .row:hover{background:#151922;}
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .cm{color:#9ad8ff;flex:none;}
  .chip{font-size:10px;font-weight:800;padding:1px 5px;border-radius:5px;flex:none;min-width:38px;text-align:center;}
  .chip.led{background:var(--led);color:#1d2321;}
  .chip.fv{background:var(--fv);color:#fff;}
  .chip.col{background:var(--col);color:#fff;}

  /* markere */
  .mk{display:flex;align-items:center;justify-content:center;border:2px solid #111;font-weight:800;font-size:10px;color:#1d2321;box-shadow:0 1px 4px rgba(0,0,0,.6);}
  .mk.led{background:var(--led);border-radius:50%;opacity:.93;}
  .mk.fv{background:var(--fv);color:#fff;border-radius:3px;transform:rotate(45deg);opacity:.93;}
  .mk.fv span{transform:rotate(-45deg);}
  .mk.aprox{border-style:dashed;}
  .mk.col{background:var(--col);border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.7);}
  .mk.sel{outline:3px solid #00e5ff;outline-offset:2px;}

  .locate-btn{background:var(--panel);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4);border:1px solid var(--border);}
  .locate-btn.loading svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .geo-wrap{position:relative;width:18px;height:18px;}
  .geo-dot{position:absolute;left:5px;top:5px;width:8px;height:8px;border-radius:50%;background:#00e5ff;border:2px solid #fff;box-shadow:0 0 6px #00e5ff;}
  .geo-ring{position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;background:rgba(0,229,255,.25);animation:pulse 1.8s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(.4);opacity:1;}100%{transform:scale(1.8);opacity:0;}}

  .leaflet-popup-content{max-height:calc(100vh - 140px);overflow-y:auto;}
  .popup-box{min-width:240px;max-width:280px;font-size:13px;}
  .popup-box h4{margin:0 0 6px;font-size:15px;line-height:1.25;}
  .tags{margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px;}
  .tag{font-size:10.5px;padding:2px 7px;border-radius:20px;background:#0b0d11;color:var(--muted);border:1px solid var(--border);}
  .tag.warn{color:var(--warn);border-color:rgba(255,145,0,.5);}
  .tag.ok{color:var(--ok);border-color:rgba(0,230,118,.4);}
  .nota{font-size:12px;color:var(--muted);margin-bottom:7px;line-height:1.4;}
  .nota.teren{color:#ffb3b0;background:rgba(224,32,27,.1);border:1px solid rgba(224,32,27,.4);border-radius:8px;padding:6px 8px;}
  .kv{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin:3px 0;}
  .kv span{color:var(--muted);} .kv b{text-align:right;font-weight:600;}
  .lnk{color:#7fd3ff;cursor:pointer;text-decoration:underline;}
  .obs-wrap{margin-top:9px;}
  .obs-wrap label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;}
  .obs-wrap textarea{width:100%;min-height:52px;resize:vertical;background:#0b0d11;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12px;font-family:inherit;}
  .btn{display:block;width:100%;margin-top:6px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;font-size:12.5px;font-weight:700;text-align:center;text-decoration:none;font-family:inherit;}
  .btn.nav{background:linear-gradient(90deg,#1a73e8,#00b0ff);color:#fff;border:none;}
  .btns2{display:flex;gap:6px;} .btns2 .btn{flex:1;}
  .coord{margin-top:6px;font-size:10.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;}

  .leaflet-popup-content-wrapper{background:var(--panel)!important;color:var(--text)!important;border:1px solid var(--border)!important;border-radius:14px!important;box-shadow:0 10px 30px rgba(0,0,0,.55)!important;}
  .leaflet-popup-content{margin:12px 14px!important;}
  .leaflet-popup-tip{background:var(--panel)!important;}
  .leaflet-container a.leaflet-popup-close-button{color:var(--muted)!important;}
  .leaflet-control-attribution{background:rgba(15,17,21,.7)!important;color:var(--muted)!important;}
  .leaflet-control-attribution a{color:#7fd3ff!important;}
  .leaflet-control-zoom a{background:var(--panel)!important;color:var(--text)!important;border-color:var(--border)!important;}
  .leaflet-control-layers{background:var(--panel)!important;color:var(--text)!important;border:1px solid var(--border)!important;border-radius:10px!important;}
  .leaflet-control-layers-toggle{filter:invert(1) brightness(1.6);}
  .leaflet-control-layers-expanded{padding:8px 12px!important;}
  .leaflet-top.leaflet-left{margin-top:44px;}
  .leaflet-tooltip.lbl{background:rgba(11,13,17,.85);border:1px solid var(--border);color:var(--text);font-size:11px;padding:2px 6px;border-radius:6px;}

  .toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#1f232c;border:1px solid var(--border);color:var(--text);
    padding:10px 16px;border-radius:10px;font-size:13px;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100vw - 40px);text-align:center;}
  .toast.show{opacity:1;}
  @media (max-width:640px){
    #legend{right:8px;top:8px;width:210px;}
    #lst{left:8px;right:8px;width:auto;bottom:8px;}
    #lstScroll{max-height:200px;}
    #topbar{padding:12px 12px 26px;}
    #topbar h1{font-size:15px;max-width:calc(100vw - 240px);}
    #topbar .sub{display:none;}
  }
</style>
</head>

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function dist(a, b){
  const R = 6371000, toR = Math.PI/180;
  const dLa = (b.lat-a.lat)*toR, dLo = (b.lon-a.lon)*toR;
  const x = Math.sin(dLa/2)**2 + Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function nearest(p, list){
  let best = null, bd = Infinity;
  list.forEach(q => { const d = dist(p, q); if (d < bd){ bd = d; best = q; } });
  return best ? {q:best, d:bd} : null;
}

  col: L.layerGroup().addTo(map),
  jt:  L.layerGroup().addTo(map),
  mt:  L.layerGroup().addTo(map),
  sj:  L.layerGroup()
};

// DEO
D.JT.forEach(l => L.polyline(l.slice(1), {pane:'deo', color:'#4fc3f7', weight:2, opacity:.75})
  .bindTooltip('JT · ' + esc(D.N[l[0]]), {sticky:true, className:'lbl'}).addTo(G.jt));
D.MT.forEach(l => L.polyline(l.slice(1), {pane:'deo', color:'#ff9100', weight:3, opacity:.85, dashArray:'8 5'})
  .bindTooltip('MT 20 kV · ' + esc(D.N[l[0]]), {sticky:true, className:'lbl'}).addTo(G.mt));
D.SJ.forEach(s => L.circleMarker([s[0], s[1]], {pane:'deo', radius:3, color:'#0b0d11', weight:1, fillColor:'#4fc3f7', fillOpacity:.95})
  .bindTooltip('Stalp JT DEO ' + esc(s[2]) + '<br>' + esc(D.N[s[3]]), {className:'lbl'}).addTo(G.sj));
D.SM.forEach(s => L.circleMarker([s[0], s[1]], {pane:'deo', radius:3.5, color:'#0b0d11', weight:1, fillColor:'#ff9100', fillOpacity:.95})
  .bindTooltip('Stalp MT DEO ' + esc(s[2]), {className:'lbl'}).addTo(G.sj));
// stalpii JT apar doar de aproape, altfel incarca harta
function syncSj(){ if (!vis.sj) return; if (map.getZoom() >= 16) map.addLayer(G.sj); else map.removeLayer(G.sj); }
map.on('zoomend', syncSj);

// ── markere ──
const ALL = [];   // {id, lat, lon, kind, label, marker}
const byId = {};
function iconP(p, sel){
  const s = p.k === 'fv' ? 19 : 22;
  const cls = 'mk ' + p.k + (p.st === 'fv_aprox' ? ' aprox' : '') + (sel ? ' sel' : '');
  return L.divIcon({className:'', html:`<div class="${cls}" style="width:${s}px;height:${s}px"><span>${p.nr}</span></div>`, iconSize:[s,s], iconAnchor:[s/2,s/2], popupAnchor:[0,-s/2]});
}
function iconT(t, sel){
  const s = t.cat === 'FV' ? 12 : 9;
  return L.divIcon({className:'', html:`<div class="mk col${sel ? ' sel' : ''}" style="width:${s}px;height:${s}px"></div>`, iconSize:[s,s], iconAnchor:[s/2,s/2], popupAnchor:[0,-s/2]});
}
function labelP(p){ return (p.k === 'fv' ? 'FV ' : 'LED ') + p.nr; }

function popupP(p){
  const st = ST[p.st] || [p.st, ''];
  const nc = nearest(p, D.T);
  return `<div class="popup-box">
    <h4>${p.k === 'fv' ? 'Stalp fotovoltaic' : 'LED 30 W'} nr. ${p.nr} <span style="color:var(--muted);font-weight:500;font-size:12px">· proiect</span></h4>
    <div class="tags"><span class="tag">plansa ${esc(p.pl)}</span><span class="tag ${st[1]}">${esc(st[0])}</span></div>
    <div class="nota">${esc(p.zona)}</div>
    ${p.teren ? `<div class="nota teren">Teren: ${esc(p.teren)}</div>` : ''}
    ${nc ? `<div class="kv"><span>Cel mai apropiat punct al colegului</span><b><span class="lnk" data-go="${nc.q.id}">${m(nc.d)}</span></b></div>` : ''}
    <div class="kv"><span>Stalp JT DEO</span><b>${m(p.jtm)}</b></div>
    ${p.jt ? `<div class="kv"><span></span><b style="font-weight:400;color:var(--muted)">${esc(p.jt)}</b></div>` : ''}
    <div class="kv"><span>Linie MT 20 kV</span><b>${m(p.mtm)}</b></div>
    <div class="nota" style="margin-top:6px;font-size:11px">Pozitionare: ${esc(p.met)}</div>
    ${obsHtml(p.id)}
    ${navHtml(p, labelP(p))}
  </div>`;
}
function popupT(t){
  const np = nearest(t, D.P);
  return `<div class="popup-box">
    <h4>${esc(t.nota)}</h4>
    <div class="tags"><span class="tag" style="color:#ff8a85">${esc(CAT[t.cat] || t.cat)}</span><span class="tag">${t.id} · teren</span></div>
    ${np ? `<div class="kv"><span>Cel mai apropiat stalp din proiect</span><b><span class="lnk" data-go="${np.q.id}">${labelP(np.q)} · ${m(np.d)}</span></b></div>` : ''}
    <div class="kv"><span>Stalp JT DEO</span><b>${m(t.jtm)}</b></div>
    ${t.jt ? `<div class="kv"><span></span><b style="font-weight:400;color:var(--muted)">${esc(t.jt)}</b></div>` : ''}
    <div class="kv"><span>Linie MT 20 kV</span><b>${m(t.mtm)}</b></div>
    ${obsHtml(t.id)}
    ${navHtml(t, t.id)}
  </div>`;
}
function obsHtml(id){
  return `<div class="obs-wrap"><label>Comentariul tau (ramane pe telefonul tau)</label>
    <textarea id="obsTxt" placeholder="ce ai vazut pe teren…">${esc(OBS[id] || '')}</textarea>
    <button class="btn" id="obsSave">💾 Salveaza comentariul</button></div>`;
}
function navHtml(p, lbl){
  return `<a class="btn nav" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank" rel="noopener">🗺 Navigheaza aici</a>
    <div class="btns2">
      <button class="btn" id="cpCoord">📍 Copiaza coordonatele</button>
      <button class="btn" id="cpLink">🔗 Link punct</button>
    </div>
    <div class="coord">${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</div>`;
}
function copy(txt, ok){
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(() => toast(ok)).catch(() => prompt('Copiaza:', txt));
  else prompt('Copiaza:', txt);
}
function wire(item){
  const b = document.getElementById('obsSave');
  if (b) b.onclick = () => {
    const v = document.getElementById('obsTxt').value.trim();
    if (v) OBS[item.id] = v; else delete OBS[item.id];
    if (saveObs()){ toast('✓ Comentariu salvat'); renderList(); }
  };
  const c = document.getElementById('cpCoord');
  if (c) c.onclick = () => copy(item.lat.toFixed(6) + ', ' + item.lon.toFixed(6), '✓ Coordonate copiate');
  const l = document.getElementById('cpLink');
  if (l) l.onclick = () => copy(location.href.split('#')[0] + '#' + item.id, '✓ Link copiat — trimite-l pe WhatsApp');
  document.querySelectorAll('[data-go]').forEach(el => el.onclick = () => go(el.getAttribute('data-go')));
}

let selId = null;
function select(id){
  if (selId && byId[selId]) byId[selId].marker.setIcon(byId[selId].icon(false));
  selId = id;
  if (id && byId[id]) byId[id].marker.setIcon(byId[id].icon(true));
}

D.P.forEach(p => {
  const mk = L.marker([p.lat, p.lon], {icon:iconP(p), zIndexOffset:500}).addTo(G[p.k]);
  mk.bindPopup(() => popupP(p), {maxWidth:300});
  mk.on('popupopen', () => { wire(p); select(p.id); history.replaceState(null, '', '#' + p.id); });
  const it = {id:p.id, lat:p.lat, lon:p.lon, kind:p.k, label:labelP(p), sub:p.zona, grp:p.zona, marker:mk, icon:s => iconP(p, s)};
  ALL.push(it); byId[p.id] = it;
});
D.T.forEach(t => {
  const mk = L.marker([t.lat, t.lon], {icon:iconT(t), zIndexOffset:1000}).addTo(G.col);
  mk.bindPopup(() => popupT(t), {maxWidth:300});
  mk.on('popupopen', () => { wire(t); select(t.id); history.replaceState(null, '', '#' + t.id); });
  const it = {id:t.id, lat:t.lat, lon:t.lon, kind:'col', label:t.nota, grp:'Teren — puncte coleg', marker:mk, icon:s => iconT(t, s)};
  ALL.push(it); byId[t.id] = it;
});
map.on('popupclose', () => { select(null); history.replaceState(null, '', location.pathname + location.search); });

function go(id){
  const it = byId[id]; if (!it) return;
  const k = it.kind;
  if (!vis[k]) toggle(k);
  map.setView([it.lat, it.lon], Math.max(map.getZoom(), 18));
  setTimeout(() => it.marker.openPopup(), 250);
}

// ── legenda ──
const vis = {led:true, fv:true, col:true, jt:true, mt:true, sj:true};
const LEG = [
  ['led', '<div class="mk led" style="width:16px;height:16px;font-size:0"></div>', 'LED propus de proiectant', D.P.filter(p => p.k === 'led').length],
  ['fv',  '<div class="mk fv" style="width:13px;height:13px"></div>', 'Stalp FV propus de proiectant', D.P.filter(p => p.k === 'fv').length],
  ['col', '<div class="mk col" style="width:10px;height:10px"></div>', 'Propunere coleg (teren)', D.T.length],
  ['jt',  '<svg width="18" height="6"><line x1="0" y1="3" x2="18" y2="3" stroke="#4fc3f7" stroke-width="2.5"/></svg>', 'Retea JT DEO 0,4 kV', ''],
  ['mt',  '<svg width="18" height="6"><line x1="0" y1="3" x2="18" y2="3" stroke="#ff9100" stroke-width="3" stroke-dasharray="6 3"/></svg>', 'Linie MT DEO 20 kV', ''],
  ['sj',  '<svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="#4fc3f7" stroke="#0b0d11"/></svg>', 'Stalpi DEO (de la zoom 16)', D.SJ.length + D.SM.length]
];
function toggle(k){
  vis[k] = !vis[k];
  if (k === 'sj'){ if (vis.sj) syncSj(); else map.removeLayer(G.sj); }
  else if (vis[k]) map.addLayer(G[k]); else map.removeLayer(G[k]);
  renderLegend();
}
function renderLegend(){
  document.getElementById('legRows').innerHTML = LEG.map(([k, sym, lbl, n]) =>
    `<div class="leg-row ${vis[k] ? '' : 'off'}" data-k="${k}"><div class="leg-sym">${sym}</div><div class="leg-label">${lbl}</div><div class="leg-count">${n}</div></div>`).join('');
  document.querySelectorAll('[data-k]').forEach(el => el.onclick = e => { e.stopPropagation(); toggle(el.getAttribute('data-k')); });
}

// ── lista ──
function renderList(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const items = ALL.filter(it => !q || (it.label + ' ' + it.id + ' ' + (it.sub || '') + ' ' + (OBS[it.id] || '')).toLowerCase().includes(q));
  const groups = {};
  items.forEach(it => (groups[it.grp] = groups[it.grp] || []).push(it));
  const order = Object.keys(groups).sort((a, b) => (a.startsWith('Teren') ? 1 : 0) - (b.startsWith('Teren') ? 1 : 0));
  document.getElementById('lstScroll').innerHTML = order.map(g =>
    `<div class="grp">${esc(g)}</div>` + groups[g].map(it =>
      `<div class="row" data-id="${it.id}">
        <span class="chip ${it.kind}">${it.kind === 'col' ? it.id : it.label}</span>
        <span class="nm">${it.kind === 'col' ? esc(it.label) : esc(it.kind === 'fv' ? 'stalp fotovoltaic' : 'LED 30 W pe stalp existent')}</span>
        ${OBS[it.id] ? '<span class="cm" title="are comentariu">💬</span>' : ''}
      </div>`).join('')).join('') || '<div class="leg-note">Nimic gasit.</div>';
  document.getElementById('lstCount').textContent = items.length;
  document.querySelectorAll('#lstScroll [data-id]').forEach(el => el.onclick = () => {
    go(el.getAttribute('data-id'));
    if (window.innerWidth <= 640) collapse(lst, true);
  });
}
document.getElementById('q').addEventListener('input', renderList);

// ── panouri pliabile ──
const legend = document.getElementById('legend'), lst = document.getElementById('lst');
function collapse(el, c){ el.classList.toggle('collapsed', c); el.classList.toggle('expanded', !c); }
document.getElementById('legendToggle').onclick = () => collapse(legend, !legend.classList.contains('collapsed'));
document.getElementById('lstToggle').onclick = () => collapse(lst, !lst.classList.contains('collapsed'));
if (window.innerWidth <= 640){ collapse(legend, true); collapse(lst, true); }

document.getElementById('btnExport').onclick = e => {
  e.stopPropagation();
  const ids = Object.keys(OBS);
  if (!ids.length){ toast('Nu ai comentarii salvate'); return; }
  const txt = 'Lungesti IP — comentarii teren\n\n' + ids.map(id => {
    const it = byId[id];
    return (it ? (it.kind === 'col' ? id + ' ' + it.label : it.label) + ' (' + it.lat.toFixed(6) + ', ' + it.lon.toFixed(6) + ')' : id) + ':\n' + OBS[id];
  }).join('\n\n');
  copy(txt, '✓ Comentariile au fost copiate — lipeste-le in mesaj');
};

// ── toast ──
let tT = null;
function toast(msg, dur){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(tT); tT = setTimeout(() => el.classList.remove('show'), dur || 2200); }

// ── geolocalizare ──
let geoWatch = null, geoMarker = null, geoCircle = null;
const GeoCtl = L.Control.extend({ options:{position:'topleft'}, onAdd: function(){
  const d = L.DomUtil.create('div', 'locate-btn'); d.id = 'geoBtn'; d.title = 'Unde sunt';
  d.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eef1f6" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>';
  L.DomEvent.disableClickPropagation(d); d.onclick = toggleGeo; return d; } });
map.addControl(new GeoCtl());
function geoSuccess(pos){
  const ll = [pos.coords.latitude, pos.coords.longitude], acc = pos.coords.accuracy || 0;
  document.getElementById('geoBtn').classList.remove('loading');
  if (!geoMarker){
    geoMarker = L.marker(ll, {icon:L.divIcon({className:'', html:'<div class="geo-wrap"><div class="geo-ring"></div><div class="geo-dot"></div></div>', iconSize:[18,18], iconAnchor:[9,9]}), zIndexOffset:2000}).addTo(map);
    geoCircle = L.circle(ll, {radius:acc, color:'#00e5ff', weight:1, fillOpacity:.08}).addTo(map);
    map.setView(ll, Math.max(map.getZoom(), 17));
  } else { geoMarker.setLatLng(ll); geoCircle.setLatLng(ll).setRadius(acc); }
}
function geoError(err){ document.getElementById('geoBtn').classList.remove('loading'); toast('⚠ Localizare indisponibila: ' + err.message, 4000); stopGeo(); }
function stopGeo(){
  if (geoWatch != null){ navigator.geolocation.clearWatch(geoWatch); geoWatch = null; }
  if (geoMarker){ map.removeLayer(geoMarker); geoMarker = null; }
  if (geoCircle){ map.removeLayer(geoCircle); geoCircle = null; }
}
function toggleGeo(){
  if (geoWatch != null){ stopGeo(); toast('Localizare oprita'); return; }
  if (!navigator.geolocation){ toast('⚠ Browserul nu suporta geolocalizare', 4000); return; }
  document.getElementById('geoBtn').classList.add('loading');
  geoWatch = navigator.geolocation.watchPosition(geoSuccess, geoError, {enableHighAccuracy:true, timeout:15000, maximumAge:5000});
}

// ── start ──
renderLegend(); renderList(); syncSj();
map.fitBounds(L.latLngBounds(ALL.map(it => [it.lat, it.lon])), {paddingTopLeft:[30,70], paddingBottomRight:[30,30]});
const h = decodeURIComponent(location.hash.slice(1));
if (h && byId[h]) setTimeout(() => go(h), 300);
</script>
</body>
</html>
