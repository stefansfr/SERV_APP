<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vladesti — Amplasamente fotovoltaice</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --text:#eef1f6; --muted:#8a92a3;
    --border:#2a2f3a; --accent:#ffd600;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #map{position:absolute;top:0;left:0;right:0;bottom:0;}

  #topbar{
    position:absolute;top:0;left:0;right:0;z-index:1000;
    background:linear-gradient(180deg,rgba(15,17,21,.92),rgba(15,17,21,0));
    padding:14px 16px 30px;pointer-events:none;
  }
  #topbar h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px;pointer-events:auto;}
  #topbar h1 span{color:var(--accent);}
  #topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;pointer-events:auto;}

  #legend{
    position:absolute;right:12px;top:12px;z-index:1000;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:14px;width:256px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    max-width:calc(100vw - 24px);
    transition:width .25s ease, padding .25s ease;
  }
  #legend h3{margin:0;font-size:13px;color:var(--text);display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;gap:8px;}
  #legend.expanded h3{margin-bottom:10px;}
  #legend h3 b{color:var(--accent);font-size:16px;}
  #legend h3 .chev{margin-left:auto;color:var(--muted);transition:transform .25s ease;flex:none;}
  #legend.collapsed h3 .chev{transform:rotate(-90deg);}
  #legend-body{overflow:hidden;max-height:900px;transition:max-height .25s ease, opacity .2s ease;opacity:1;}
  #legend.collapsed{padding:9px 14px;border-radius:22px;cursor:pointer;}
  #legend.collapsed #legend-body{max-height:0;opacity:0;}
  #legend-mini{display:none;align-items:center;gap:6px;font-weight:600;color:var(--text);white-space:nowrap;}
  #legend.collapsed #legend-mini{display:flex;}
  #legend.collapsed .mini-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;}
  .leg-row{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer;}
  .leg-row.off{opacity:.38;}
  .leg-dot{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:0 0 6px rgba(0,0,0,.5);}
  .leg-label{color:var(--muted);flex:1;}
  .leg-count{color:var(--text);font-weight:600;}
  .cat-row{display:flex;align-items:center;gap:8px;margin:5px 0;}
  .cat-row svg{flex:none;}
  .cat-label{color:var(--muted);flex:1;}
  .cat-count{color:var(--text);font-weight:600;}
  .leg-sep{margin:10px 0;border-top:1px solid var(--border);}
  .kpi{display:flex;justify-content:space-between;align-items:baseline;margin:5px 0;gap:8px;}
  .kpi span{color:var(--muted);font-size:11.5px;}
  .kpi b{font-size:13.5px;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .kpi b.hi{color:var(--accent);}
  .progress-wrap{margin-top:8px;height:8px;border-radius:5px;background:#0b0d11;overflow:hidden;border:1px solid var(--border);}
  .progress-bar{height:100%;background:linear-gradient(90deg,#ff9100,#ffd600,#00e676);width:0%;}
  .progress-txt{margin-top:6px;font-size:11px;color:var(--muted);text-align:right;}
  .leg-tools{display:flex;gap:6px;margin-top:10px;}
  .leg-tools button{
    flex:1;padding:6px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);cursor:pointer;font-size:11.5px;font-weight:600;
  }
  .leg-tools button:hover{background:#2a3040;}

  .locate-btn{
    background:var(--panel);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4);border:1px solid var(--border);
  }
  .locate-btn:hover{background:var(--panel2);}
  .locate-btn.loading svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .geo-wrap{position:relative;width:18px;height:18px;}
  .geo-dot{position:absolute;left:5px;top:5px;width:8px;height:8px;border-radius:50%;background:#00e5ff;border:2px solid #fff;box-shadow:0 0 6px #00e5ff;}
  .geo-ring{position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;background:rgba(0,229,255,.25);animation:pulse 1.8s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(.4);opacity:1;}100%{transform:scale(1.8);opacity:0;}}

  /* Popup-ul cu 5 locuri de consum depasea inaltimea ecranului si butonul de
     salvare ramanea dedesubt. Corpul se deruleaza, butonul sta fixat jos. */
  .leaflet-popup-content{max-height:calc(100vh - 140px);display:flex;flex-direction:column;}
  .popup-box{min-width:250px;max-width:278px;font-size:13px;display:flex;flex-direction:column;min-height:0;}
  .popup-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;flex:1 1 auto;padding-right:3px;}
  .popup-foot{
    flex:none;position:sticky;bottom:0;background:var(--panel);
    padding-top:8px;margin-top:2px;border-top:1px solid var(--border);
  }
  .popup-box h4{margin:0 0 5px;font-size:15px;line-height:1.25;}
  .popup-box .tags{margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px;}
  .popup-box .tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:20px;background:#0b0d11;color:var(--muted);border:1px solid var(--border);}
  .popup-box .tag.teren{color:#04121a;font-weight:700;border-color:transparent;}
  .nota{font-size:11.5px;color:var(--muted);font-style:italic;margin-bottom:8px;line-height:1.35;}
  .inst-btn{
    width:100%;padding:8px;border-radius:9px;border:1px solid var(--border);
    background:var(--panel2);color:var(--muted);cursor:pointer;font-size:12.5px;
    font-weight:700;font-family:inherit;margin-bottom:9px;transition:background .15s;
  }
  .inst-btn:hover{background:#2a3040;}
  .inst-btn.on{background:#00e676;color:#04121a;border-color:transparent;}

  .lc-list{margin-bottom:8px;}
  .lc-head{font-size:11px;color:var(--muted);margin-bottom:3px;}
  .lc-row{
    display:flex;align-items:baseline;gap:6px;padding:5px 8px;border-radius:8px;
    background:#0b0d11;border:1px solid var(--border);margin-bottom:3px;font-size:11.5px;
  }
  .lc-row .lc-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lc-row .lc-cod{color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums;}
  .lc-row .lc-kwh{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .lc-none{font-size:11.5px;color:#ff9100;background:rgba(255,145,0,.08);border:1px solid rgba(255,145,0,.35);
           border-radius:8px;padding:6px 8px;line-height:1.35;}
  .badge-nesigur{
    display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:20px;margin-left:4px;
    background:rgba(255,145,0,.15);color:#ff9100;border:1px solid rgba(255,145,0,.4);font-weight:700;
  }

  .pv-wrap{margin-top:9px;padding:9px;border-radius:10px;background:#0b0d11;border:1px solid var(--border);}
  .pv-row{display:flex;align-items:center;gap:7px;}
  .pv-row label{font-size:11px;color:var(--muted);flex:none;}
  .pv-row input{
    width:64px;flex:none;background:var(--panel2);color:var(--text);
    border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:13px;
    font-family:inherit;font-weight:700;text-align:center;
  }
  .pv-row .pv-mul{color:var(--muted);font-size:11.5px;flex:none;}
  .pv-row .pv-kw{margin-left:auto;font-weight:800;font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums;}
  .pv-calc{margin-top:7px;font-size:11px;color:var(--muted);line-height:1.5;}
  .pv-calc b{color:var(--text);font-variant-numeric:tabular-nums;}
  .pv-bar{margin-top:6px;height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;}
  .pv-bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9100,#ffd600,#00e676);}

  .obs-wrap{margin-top:9px;}
  .obs-wrap label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;}
  .obs-wrap textarea{
    width:100%;min-height:52px;resize:vertical;background:#0b0d11;color:var(--text);
    border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12px;font-family:inherit;
  }
  .obs-save{
    margin-top:5px;width:100%;padding:7px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);cursor:pointer;font-size:12px;font-weight:700;
  }
  .obs-save:hover{background:#2a3040;}
  .popup-foot .obs-save{margin-top:0;}
  .nav-btn{
    display:block;margin-top:8px;padding:8px;border-radius:8px;text-align:center;
    background:linear-gradient(90deg,#1a73e8,#00b0ff);color:#fff;font-weight:700;font-size:12.5px;
    text-decoration:none;
  }
  .nav-btn:hover{filter:brightness(1.15);}
  .coord{margin-top:6px;font-size:10.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;}

  /* ── Leaflet pe tema intunecata ── */
  /* Fara astea, popup-ul ramane alb cu text alb: nu se citeste nimic. */
  .leaflet-popup-content-wrapper{
    background:var(--panel)!important;color:var(--text)!important;
    border:1px solid var(--border)!important;border-radius:14px!important;
    box-shadow:0 10px 30px rgba(0,0,0,.55)!important;
  }
  .leaflet-popup-content{margin:12px 14px!important;}
  .leaflet-popup-tip{background:var(--panel)!important;border:1px solid var(--border)!important;box-shadow:none!important;}
  .leaflet-container a.leaflet-popup-close-button{color:var(--muted)!important;}
  .leaflet-container a.leaflet-popup-close-button:hover{color:var(--text)!important;}
  .leaflet-control-attribution{background:rgba(15,17,21,.7)!important;color:var(--muted)!important;}
  .leaflet-control-attribution a{color:#7fd3ff!important;}
  .leaflet-control-zoom a{background:var(--panel)!important;color:var(--text)!important;border-color:var(--border)!important;}
  .leaflet-control-layers{background:var(--panel)!important;color:var(--text)!important;border:1px solid var(--border)!important;border-radius:10px!important;box-shadow:0 6px 18px rgba(0,0,0,.4)!important;}
  .leaflet-control-layers-toggle{filter:invert(1) brightness(1.6);}
  .leaflet-control-layers-expanded{padding:8px 12px!important;}
  .leaflet-control-layers label{color:var(--text)!important;font-size:12.5px;}
  /* Controalele coboara sub titlu, ca sa nu acopere subtitlul. */
  .leaflet-top.leaflet-left{margin-top:44px;}

  .toast{
    position:absolute;left:50%;bottom:28px;transform:translateX(-50%);
    background:#1f232c;border:1px solid var(--border);color:var(--text);
    padding:10px 16px;border-radius:10px;font-size:13px;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,.5);
    opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100vw - 40px);text-align:center;
  }
  .toast.show{opacity:1;}

  @media (max-width:640px){
    #legend{ right:8px; top:8px; width:218px; }
    #topbar{ padding:12px 12px 26px; }
    #topbar h1{ font-size:15px; }
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <h1>Vladesti <span>PV</span> — amplasamente fotovoltaice</h1>
  <div class="sub" id="subTxt">22 locatii din teren · consum din facturile Premier Energy</div>
</div>

<div id="legend" class="expanded">
  <h3 id="legendToggle">
    <span>Putere instalata <b id="kwBig">–</b></span>
    <span id="legend-mini"><span class="mini-dot"></span><span id="miniTxt">–</span></span>
    <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
  </h3>
  <div id="legend-body">
    <div id="catRows"></div>
    <div class="leg-sep"></div>
    <div id="instRows"></div>
    <div class="leg-sep"></div>
    <div class="kpi"><span>Panouri amplasate</span><b id="kPan">0</b></div>
    <div class="kpi"><span>Putere instalata</span><b class="hi" id="kKw">0,00 kW</b></div>
    <div class="kpi"><span>Productie estimata</span><b id="kProd">0 kWh/an</b></div>
    <div class="leg-sep" style="margin:8px 0"></div>
    <div class="kpi"><span>Consum anual unde instalez</span><b class="hi" id="kInst">0 kWh/an</b></div>
    <div class="kpi"><span>Consum total UAT</span><b id="kUat">0 kWh/an</b></div>
    <div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>
    <div class="progress-txt" id="ptxt">–</div>
    <div class="leg-tools">
      <button id="btnExport" title="Copiaza panourile si comentariile ca JSON">📋 Export</button>
      <button id="btnReset" title="Sterge modificarile locale si revino la datele din fisier">↺ Reset</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────

// modifici in harta (panouri + comentarii) se salveaza in browserul tau.
// Nimic nu pleaca spre un server.
const PUTERE_PANOU_W = 500;      // W/panou — se schimba aici, o singura data

// PREZUMTIE, nu data de proiect: productia specifica folosita la estimare.
// Se inlocuieste cu PVGIS pe fiecare amplasament inainte de orice document.
const PRODUCTIE_SPECIFICA = 1250;   // kWh/kWp/an

const STORE = 'vladesti_pv_v1';

// ── Decizia de instalare — culoarea markerului ──────────────────────────────

// popup si se tine in localStorage, deci decizia din teren bate fisierul.

  nu: { label:'Fara panouri',     color:'#9e9e9e' }

// ── Locatiile din teren ─────────────────────────────────────────────────────

// mine din denumire sau din numerotarea auditului — se confirma pe teren.

  { id:'IL5', inst:true,    nume:'Punct iluminat 5', tip:'bec', teren:'putin',

// ── Stare locala (panouri + comentarii) ─────────────────────────────────────
let STATE = {};
function loadState(){
  try{
    const raw = localStorage.getItem(STORE);
    STATE = raw ? JSON.parse(raw) : {};
  }catch(e){ STATE = {}; console.warn('Nu s-a putut citi starea locala', e); }
}
function saveState(){
  try{ localStorage.setItem(STORE, JSON.stringify(STATE)); return true; }
  catch(e){ toast('⚠ Nu s-a putut salva local: ' + e.message, 4500); return false; }
}
function stOf(id){
  if (!STATE[id]) STATE[id] = { panouri:0, obs:'' };
  return STATE[id];
}
// Decizia de instalare: ce ai comutat in harta bate valoarea din fisier.
function instOf(p){
  const s = STATE[p.id];
  return (s && typeof s.inst === 'boolean') ? s.inst : !!p.inst;
}
function setInst(p, v){
  stOf(p.id).inst = v;
  if (saveState()){
    markers[p.id].setIcon(makeIcon(p));
    markers[p.id].setPopupContent(popupHtml(p));
    wirePopup(p);
    updateLegend();
    toast(v ? '✓ ' + p.nume.split('—')[0].trim() + ': se instaleaza' : '○ ' + p.nume.split('—')[0].trim() + ': fara panouri');
  }
}

// ── Utilitare ───────────────────────────────────────────────────────────────
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nf(n, d){
  return Number(n).toLocaleString('ro-RO', {minimumFractionDigits:d||0, maximumFractionDigits:d||0});
}
// Referinta pentru acoperire: consumul TOTAL al UAT pe 12 luni, nu doar al
// locurilor legate de markere. Productia intra in balanta comunei, chiar daca
// panourile nu stau pe locul de consum care o foloseste.
const CONSUM_UAT = Object.keys(LC).reduce((s, c) => s + LC[c][1], 0);

function kwOf(p){ return (stOf(p.id).panouri || 0) * PUTERE_PANOU_W / 1000; }
function consumOf(p){
  return (p.lc || []).reduce((s, x) => s + (LC[x[0]] ? LC[x[0]][1] : 0), 0);
}
function prodOf(p){ return kwOf(p) * PRODUCTIE_SPECIFICA; }

function svgFor(p, color, w){

function makeIcon(p){
  const color = instOf(p) ? INSTALARE.da.color : INSTALARE.nu.color;
  const sizes = { bec:[30,36], casa:[30,34], grup:[38,34], teren:[34,32] };
  const [iw, ih] = sizes[p.tip] || sizes.bec;
  return L.divIcon({
    className:'', html: svgFor(p, color),
    iconSize:[iw, ih], iconAnchor:[iw/2, ih-2], popupAnchor:[0, -(ih-4)]
  });
}

// ── Popup ───────────────────────────────────────────────────────────────────
function lcHtml(p){
  if (!p.lc || !p.lc.length){
    const msg = p.tip === 'teren'
      ? 'Teren, nu loc de consum — nu are consum propriu.'
      : 'Niciun loc de consum atasat inca. Numerotarea punctelor de iluminat din teren nu se poate lega de codurile din facturi fara cheia ta.';
    return `<div class="lc-list"><div class="lc-none">${msg}</div></div>`;
  }
  let rows = '';
  p.lc.forEach(([cod, sigur]) => {
    const r = LC[cod];
    if (!r) return;
    rows += `<div class="lc-row">
      <span class="lc-nm">${esc(r[0])}${sigur ? '' : '<span class="badge-nesigur">propus</span>'}</span>
      <span class="lc-cod">${esc(cod)}</span>
      <span class="lc-kwh">${nf(r[1])} kWh</span>
    </div>`;
  });
  const tot = consumOf(p);
  return `<div class="lc-list">
    <div class="lc-head">Locuri de consum atasate — consum pe 12 luni (iul.2025–iun.2026)</div>
    ${rows}
    ${p.lc.length > 1 ? `<div class="lc-row"><span class="lc-nm"><b>Total</b></span><span class="lc-kwh">${nf(tot)} kWh</span></div>` : ''}
  </div>`;
}
function pvHtml(p){
  const s = stOf(p.id);
  const kw = kwOf(p), prod = prodOf(p), cons = consumOf(p);
  const acop = cons > 0 ? Math.round(prod / cons * 100) : null;
  return `<div class="pv-wrap">
    <div class="pv-row">
      <label>Panouri</label>
      <input type="number" id="panIn" min="0" step="1" value="${s.panouri || 0}">
      <span class="pv-mul">× ${PUTERE_PANOU_W} W =</span>
      <span class="pv-kw" id="kwOut">${nf(kw, 2)} kW</span>
    </div>
    <div class="pv-calc">
      Productie estimata: <b id="prodOut">${nf(prod)}</b> kWh/an
      <span style="opacity:.7">(la ${nf(PRODUCTIE_SPECIFICA)} kWh/kWp — prezumtie, se inlocuieste cu PVGIS)</span>
      <br>Aduce <b id="uatOut">${nf(prod / CONSUM_UAT * 100, 1)}%</b> din consumul total al UAT
      <span style="opacity:.7">(${nf(CONSUM_UAT)} kWh/an)</span>
      ${cons > 0 ? `<br>Acopera <b id="acopOut">${acop == null ? '–' : acop}%</b> din consumul locurilor atasate` : ''}
    </div>
    <div class="pv-bar"><i id="pvBar" style="width:${Math.min(100, prod / CONSUM_UAT * 100)}%"></i></div>
  </div>`;
}
function popupHtml(p){
  const t = TEREN[p.teren] || TEREN.nedefinit;
  const s = stOf(p.id);
  const on = instOf(p);
  return `<div class="popup-box">
    <div class="popup-scroll">
      <h4>${esc(p.nume)}</h4>
      <div class="tags">
        <span class="tag">${esc((TIPURI[p.tip] || {}).label || p.tip)}</span>
        <span class="tag">${esc(t.label)}</span>
      </div>
      <button class="inst-btn ${on ? 'on' : ''}" id="instBtn">${on ? '✓ Instalez panouri aici' : '○ Fara panouri aici'}</button>
      ${p.nota ? `<div class="nota">${esc(p.nota)}</div>` : ''}
      ${lcHtml(p)}
      ${pvHtml(p)}
      <div class="obs-wrap">
        <label>Comentarii</label>
        <textarea id="obsTxt" placeholder="ce ai vazut pe teren…">${esc(s.obs)}</textarea>
      </div>
      <a class="nav-btn" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank" rel="noopener">🗺 Navigheaza aici</a>
      <div class="coord">${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</div>
    </div>
    <div class="popup-foot">
      <button class="obs-save" id="obsSave">💾 Salveaza panouri + comentariu</button>
    </div>
  </div>`;
}

// Recalculeaza live cifrele din popup, fara sa inchida tastatura pe telefon.
function wirePopup(p){
  const inp = document.getElementById('panIn');
  const kwOut = document.getElementById('kwOut');
  const prodOut = document.getElementById('prodOut');
  const acopOut = document.getElementById('acopOut');
  const uatOut = document.getElementById('uatOut');
  const pvBar = document.getElementById('pvBar');
  const cons = consumOf(p);
  if (inp){
    inp.addEventListener('input', () => {
      const n = Math.max(0, parseInt(inp.value, 10) || 0);
      const kw = n * PUTERE_PANOU_W / 1000, prod = kw * PRODUCTIE_SPECIFICA;
      if (kwOut)   kwOut.textContent = nf(kw, 2) + ' kW';
      if (prodOut) prodOut.textContent = nf(prod);
      const u = prod / CONSUM_UAT * 100;
      if (uatOut) uatOut.textContent = nf(u, 1) + '%';
      if (pvBar)  pvBar.style.width = Math.min(100, u) + '%';
      if (cons > 0 && acopOut) acopOut.textContent = Math.round(prod / cons * 100) + '%';
    });
  }
  const ib = document.getElementById('instBtn');
  if (ib) ib.addEventListener('click', () => setInst(p, !instOf(p)));
  const btn = document.getElementById('obsSave');
  if (btn) btn.addEventListener('click', () => {
    const s = stOf(p.id);
    s.panouri = Math.max(0, parseInt((inp && inp.value) || 0, 10) || 0);
    const ta = document.getElementById('obsTxt');
    s.obs = ta ? ta.value : s.obs;
    if (saveState()){
      toast('✓ Salvat local: ' + s.panouri + ' panouri (' + nf(kwOf(p), 2) + ' kW)');
      markers[p.id].setIcon(makeIcon(p));
      updateLegend();
    }
  });
}

// ── Markere ─────────────────────────────────────────────────────────────────
const markers = {};
function drawAll(){
  PUNCTE.forEach(p => {
    const m = L.marker([p.lat, p.lon], {icon: makeIcon(p)})
      .addTo(tipGroups[p.tip] || tipGroups.bec)
      .bindPopup(popupHtml(p), {closeButton:true, maxWidth:300});
    m.on('popupopen', () => { m.setPopupContent(popupHtml(p)); wirePopup(p); });
    markers[p.id] = m;
  });
}

// ── Legenda ─────────────────────────────────────────────────────────────────
const tipVisible = { bec:true, casa:true, grup:true, teren:true };
function updateLegend(){
  // randuri pe tip, cu iconita reala
  let cat = '';
  Object.keys(TIPURI).forEach(k => {
    const n = PUNCTE.filter(p => p.tip === k).length;
    cat += `<div class="cat-row leg-row ${tipVisible[k] ? '' : 'off'}" data-tip="${k}">
      ${svgFor({tip:k}, '#8a92a3', 17)}
      <span class="cat-label">${TIPURI[k].label}</span>
      <span class="cat-count">${n}</span>
    </div>`;
  });
  document.getElementById('catRows').innerHTML = cat;
  document.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.getAttribute('data-tip');
      tipVisible[k] = !tipVisible[k];
      if (tipVisible[k]) map.addLayer(tipGroups[k]); else map.removeLayer(tipGroups[k]);
      updateLegend();
    });
  });

  const nDa = PUNCTE.filter(p => instOf(p)).length;
  document.getElementById('instRows').innerHTML = [['da', nDa], ['nu', PUNCTE.length - nDa]]
    .map(([k, n]) => `<div class="leg-row" style="cursor:default">
      <div class="leg-dot" style="background:${INSTALARE[k].color}"></div>
      <div class="leg-label">${INSTALARE[k].label}</div>
      <div class="leg-count">${n}</div>
    </div>`).join('');

  const pan  = PUNCTE.reduce((s,p) => s + (stOf(p.id).panouri || 0), 0);
  const kw   = pan * PUTERE_PANOU_W / 1000;
  const prod = kw * PRODUCTIE_SPECIFICA;
  // Consumul locurilor atasate punctelor unde s-a decis instalarea.
  const consInst = PUNCTE.filter(p => instOf(p)).reduce((s,p) => s + consumOf(p), 0);
  document.getElementById('kPan').textContent  = nf(pan);
  document.getElementById('kKw').textContent   = nf(kw, 2) + ' kW';
  document.getElementById('kwBig').textContent = nf(kw, 2) + ' kW';
  document.getElementById('miniTxt').textContent = nf(kw, 2) + ' kW · ' + pan + ' pan.';
  document.getElementById('kProd').textContent = nf(prod) + ' kWh/an';
  document.getElementById('kUat').textContent  = nf(CONSUM_UAT) + ' kWh/an';
  document.getElementById('kInst').textContent = nf(consInst) + ' kWh/an';
  const pct = prod / CONSUM_UAT * 100;
  document.getElementById('pbar').style.width = Math.min(100, pct) + '%';
  document.getElementById('ptxt').textContent = nf(pct, 1) + '% din consumul total al UAT';
}

// ── Export / reset ──────────────────────────────────────────────────────────
function exportJson(){
  const out = PUNCTE.map(p => ({
    id:p.id, nume:p.nume, tip:p.tip, teren:p.teren, lat:p.lat, lon:p.lon,
    instalez: instOf(p),
    lc:(p.lc||[]).map(x => x[0]),
    consum_lc: consumOf(p),
    panouri: stOf(p.id).panouri || 0,
    kw: kwOf(p),
    obs: stOf(p.id).obs || ''
  }));
  const txt = JSON.stringify(out, null, 1);
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt)
      .then(() => toast('✓ Datele au fost copiate in clipboard'))
      .catch(() => { console.log(txt); toast('Datele sunt in consola browserului'); });
  } else {
    console.log(txt);
    toast('Datele sunt in consola browserului');
  }
}
function resetLocal(){
  if (!confirm('Sterg panourile si comentariile salvate in acest browser?')) return;
  try{ localStorage.removeItem(STORE); }catch(e){}
  STATE = {};
  PUNCTE.forEach(p => markers[p.id] && markers[p.id].setIcon(makeIcon(p)));
  map.closePopup();
  updateLegend();
  toast('↺ Starea locala a fost stearsa');
}

      className:'', html:'<div class="geo-wrap"><div class="geo-ring"></div><div class="geo-dot"></div></div>',
      iconSize:[18,18], iconAnchor:[9,9]
    })}).addTo(map);
    geoCircle = L.circle(ll, {radius:acc, color:'#00e5ff', weight:1, fillOpacity:.08}).addTo(map);
    map.setView(ll, Math.max(map.getZoom(), 16));
  } else {
    geoMarker.setLatLng(ll); geoCircle.setLatLng(ll).setRadius(acc);
  }
}
function geoError(err){
  document.getElementById('geoBtn').classList.remove('loading');
  toast('⚠ Localizare indisponibila: ' + err.message, 4000);
  stopGeo();
}
function stopGeo(){
  if (geoWatch != null){ navigator.geolocation.clearWatch(geoWatch); geoWatch = null; }
  if (geoMarker){ map.removeLayer(geoMarker); geoMarker = null; }
  if (geoCircle){ map.removeLayer(geoCircle); geoCircle = null; }
}
function toggleGeo(){
  if (geoWatch != null){ stopGeo(); toast('Localizare oprita'); return; }
  if (!navigator.geolocation){ toast('⚠ Browserul nu suporta geolocalizare', 4000); return; }
  document.getElementById('geoBtn').classList.add('loading');
  geoWatch = navigator.geolocation.watchPosition(geoSuccess, geoError, {enableHighAccuracy:true, timeout:15000, maximumAge:5000});
}

// ── Start ───────────────────────────────────────────────────────────────────
loadState();
drawAll();
updateLegend();
document.getElementById('btnExport').addEventListener('click', e => { e.stopPropagation(); exportJson(); });
document.getElementById('btnReset').addEventListener('click',  e => { e.stopPropagation(); resetLocal(); });
map.fitBounds(L.latLngBounds(PUNCTE.map(p => [p.lat, p.lon])), {padding:[60,60], maxZoom:15});
document.getElementById('subTxt').textContent =
  PUNCTE.length + ' locatii · consum total UAT ' + nf(CONSUM_UAT) +
  ' kWh/an (29 locuri de consum, 12 luni din facturi)';
</script>
</body>
</html>
